[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfci-bench"
version = "1.0.0"
description = "MFCI-Bench: the Multi-Fault CI Builds Benchmark for test-failure triage (ASE 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lior Broide" },
    { name = "Argaman Mordoch" },
    { name = "Roni Stern" },
]
keywords = ["benchmark", "continuous-integration", "test-failure-triage", "clustering", "defects4j"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Paper = "https://doi.org/10.1145/3832783.3837467"
Repository = "https://github.com/LiorBroideBGU/MFCI-Bench"

[project.scripts]
mfci-generate = "mfci_bench.cli:generate_main"
mfci-sample = "mfci_bench.cli:sample_main"

[tool.hatch.build.targets.wheel]
packages = ["mfci_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: rebuilds builds from the single-fault sources (a few seconds to a minute)"]
